# The one packaging leg: build the wheel and the sdist, check the metadata, and install and
# RUN each of them from its own CLEAN venv.
#
# WHY IT IS AN ACTION AND NOT A STEP IN EACH WORKFLOW. release.yml's verify job built both
# artifacts and ran `twine check` on the METADATA, and nothing anywhere in that workflow
# installed either one. So the artifact handed to `pypa/gh-action-pypi-publish` — the one
# step in this repository with no compensator — was the one artifact never installed in the
# workflow that publishes it. ci.yml had the leg in full; copying it into the second
# workflow would be a second implementation of one gate, which is exactly how the font
# dependency forked (see .github/actions/sheet-fonts/action.yml). One action, called by both.
#
# WHY THE PROBE CALLS FUNCTIONS. `armature check` and `armature modules` execute no function
# body: `check` imports each surface module and `modules` prints a table, so no lazy import
# is ever reached. Measured in this exact clean room — armature-studio and numpy only —
# `armature check` printed `all modules resolved` and exited 0 while cv2, matplotlib and PIL
# were absent and both the drawing path and Gate DONOR raised ModuleNotFoundError on first
# call. The leg was green on precisely the wheel defect it exists to catch.
# tests/test_ci_workflows.py derives the required call sites from the source, so a new lazy
# dependency fails until this probe reaches it.
#
# WHY build AND twine ARE CONSTRAINED. These are the two tools that PRODUCE the artifact
# published irreversibly, and they were resolved fresh on release day. The repo already
# holds the sibling toolchain to a version for exactly this reason — `npm install -g
# npm@^11.5.1`, whose comment says `@latest` means the code running on release day is not
# the code that was verified. A `build` release that changed sdist file selection would
# change the published artifact between two runs of the SAME tag. The floors are the
# versions this rig has run (build 1.5.0, twine 7.0.0, measured 2026-09-04); the ceilings
# keep a new major out of the publish path until someone runs it deliberately.
name: clean room
description: Build the wheel and sdist, check the metadata, and run each from its own clean install.

runs:
  using: composite
  steps:
    - name: build the package and run it from a clean install
      shell: bash
      run: |
        set -eu
        python -m pip install "build>=1.5,<2" "twine>=7,<8"
        python -m build
        python -m twine check dist/*
        # THE SDIST, BUILT FROM AND RUN. Three artifacts leave this repository and, until this
        # line, two of them were installed before the publish: the wheel below, and the npm
        # tarball in the sibling action. `twine check dist/*` reads METADATA and never opens
        # either archive; release.yml uploads the whole of `dist/` and
        # `pypa/gh-action-pypi-publish` publishes both files -- so the sdist was the third
        # artifact, and this action's own header states the law it was written for: "the
        # artifact handed to publish was the one artifact never installed in the workflow that
        # publishes it."
        #
        # What the suite covers is CONTENTS, not buildability: `tests/test_packaging.py`
        # unpacks a built sdist and asserts what it carries. An edit to MANIFEST.in or to
        # `[tool.setuptools]`, or a setuptools inside the `>=77,<85` window that changes sdist
        # file selection, ships an archive that cannot build -- with every gate in release.yml
        # green, because nothing here builds from it. That failure lands on
        # `pip install --no-binary :all:`, on a distro or conda-forge packager, after the
        # version is taken on PyPI forever.
        #
        # `pip install <sdist>` runs the backend under build isolation, so this exercises
        # `[build-system].requires` and MANIFEST.in the way a downstream packager does, which
        # installing a wheel cannot. Its OWN venv, because a wheel already present in the other
        # room would satisfy the requirement without the archive ever being opened.
        #
        # `--no-deps`, and `modules --json` rather than the wheel room's full probe: the
        # question here is whether the ARCHIVE builds and the command it installs runs, and the
        # room below already resolves and exercises the runtime dependency set. Measured on the
        # rig 2026-09-04 against this tree's sdist -- `pip install --no-deps` exit 0,
        # `armature modules --json` exit 0, `armature_core` imported from that venv's
        # site-packages -- so this is a guard on a path that works today, not a repair.
        python -m venv /tmp/cleanroom-sdist
        /tmp/cleanroom-sdist/bin/python -m pip install --quiet --no-deps dist/*.tar.gz
        /tmp/cleanroom-sdist/bin/armature modules --json > /dev/null
        python -m venv /tmp/cleanroom
        /tmp/cleanroom/bin/python -m pip install --quiet dist/*.whl
        /tmp/cleanroom/bin/armature check
        /tmp/cleanroom/bin/armature modules --json > /dev/null
        /tmp/cleanroom/bin/python - <<'PROBE'
        import os, tempfile
        import numpy as np
        from armature_core import aapose, donor_gate, pngio

        # The leg's own premise, checked rather than assumed: this must be the wheel, not
        # the checkout sitting one directory up.
        if "site-packages" not in aapose.__file__.replace("\\", "/"):
            raise SystemExit("clean-room probe imported the source tree: " + aapose.__file__)

        canvas = aapose.blank_canvas(64, 64)
        body = np.zeros((aapose.KEYPOINT_COUNT, 3)); body[:, :2] = 32.0; body[:, 2] = 1.0
        aapose.draw_body(canvas, body)
        hand = np.zeros((aapose.HAND_KEYPOINT_COUNT, 3)); hand[:, :2] = 32.0; hand[:, 2] = 1.0
        aapose.draw_hand(canvas, hand)

        frames = tempfile.mkdtemp()
        paths = []
        for i in range(2):
            p = os.path.join(frames, "%05d.png" % i)
            pngio.write_png(p, np.full((8, 8, 3), i * 40, dtype=np.uint8))
            paths.append(p)
        donor_gate.mean_consecutive_frame_difference(paths)
        print("clean room: draw_body, draw_hand and mean_consecutive_frame_difference all ran")
        PROBE
