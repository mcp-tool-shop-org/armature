# The one packaging leg: build the wheel and the sdist, check the metadata, and install and
# RUN each of them from its own CLEAN venv.
#
# WHY IT IS AN ACTION AND NOT A STEP IN EACH WORKFLOW. release.yml's verify job built both
# artifacts and ran `twine check` on the METADATA, and nothing anywhere in that workflow
# installed either one. So the artifact handed to `pypa/gh-action-pypi-publish` — the one
# step in this repository with no compensator — was the one artifact never installed in the
# workflow that publishes it. ci.yml had the leg in full; copying it into the second
# workflow would be a second implementation of one gate, which is exactly how the font
# dependency forked (see .github/actions/sheet-fonts/action.yml). One action, called by both.
#
# WHY THE PROBE CALLS FUNCTIONS. `armature check` and `armature modules` execute no function
# body: `check` imports each surface module and `modules` prints a table, so no lazy import
# is ever reached. Measured in this exact clean room — armature-studio and numpy only —
# `armature check` printed `all modules resolved` and exited 0 while cv2, matplotlib and PIL
# were absent and both the drawing path and Gate DONOR raised ModuleNotFoundError on first
# call. The leg was green on precisely the wheel defect it exists to catch.
# tests/test_ci_workflows.py derives the required call sites from the source, so a new lazy
# dependency fails until this probe reaches it -- and the source it now reads is
# `lazy_import_probe.py`, where each function name appears ONCE, at the call site. That
# sentence was false when the probe was a heredoc ending in a printed literal naming all
# three functions: measured on `e8263a3` with every call site replaced by `pass`, the census
# passed on the announcement alone (216 passed; `-k clean_room_leg_reaches` -> 1 passed).
#
# WHY build AND twine ARE CONSTRAINED. These are the two tools that PRODUCE the artifact
# published irreversibly, and they were resolved fresh on release day. The repo already
# holds the sibling toolchain to a version for exactly this reason — `npm install -g
# npm@^11.5.1`, whose comment says `@latest` means the code running on release day is not
# the code that was verified. A `build` release that changed sdist file selection would
# change the published artifact between two runs of the SAME tag. The floors are the
# versions this rig has run (build 1.5.0, twine 7.0.0, measured 2026-09-04); the ceilings
# keep a new major out of the publish path until someone runs it deliberately.
name: clean room
description: Build the wheel and sdist, check the metadata, and run each from its own clean install.

runs:
  using: composite
  steps:
    - name: build the package and run it from a clean install
      shell: bash
      run: |
        set -eu
        python -m pip install "build>=1.5,<2" "twine>=7,<8"
        python -m build
        python -m twine check dist/*
        # THE SDIST, BUILT FROM AND RUN. Three artifacts leave this repository and, until this
        # line, two of them were installed before the publish: the wheel below, and the npm
        # tarball in the sibling action. `twine check dist/*` reads METADATA and never opens
        # either archive; release.yml uploads the whole of `dist/` and
        # `pypa/gh-action-pypi-publish` publishes both files -- so the sdist was the third
        # artifact, and this action's own header states the law it was written for: "the
        # artifact handed to publish was the one artifact never installed in the workflow that
        # publishes it."
        #
        # What the suite covers is CONTENTS, not buildability: `tests/test_packaging.py`
        # unpacks a built sdist and asserts what it carries. An edit to MANIFEST.in or to
        # `[tool.setuptools]`, or a setuptools inside the `>=77,<85` window that changes sdist
        # file selection, ships an archive that cannot build -- with every gate in release.yml
        # green, because nothing here builds from it. That failure lands on
        # `pip install --no-binary :all:`, on a distro or conda-forge packager, after the
        # version is taken on PyPI forever.
        #
        # `pip install <sdist>` runs the backend under build isolation, so this exercises
        # `[build-system].requires` and MANIFEST.in the way a downstream packager does, which
        # installing a wheel cannot. Its OWN venv, because a wheel already present in the other
        # room would satisfy the requirement without the archive ever being opened.
        #
        # `--no-deps`, and `modules --json` rather than the wheel room's full probe: the
        # question here is whether the ARCHIVE builds and the command it installs runs, and the
        # room below already resolves and exercises the runtime dependency set. Measured on the
        # rig 2026-09-04 against this tree's sdist -- `pip install --no-deps` exit 0,
        # `armature modules --json` exit 0, `armature_core` imported from that venv's
        # site-packages -- so this is a guard on a path that works today, not a repair.
        #
        # WHAT EACH ROOM RESOLVED, STATED. Both installs carried `--quiet`, which removes the
        # one line saying what came out of the index. The wheel room deliberately resolves the
        # runtime set FRESH (that is a user's experience of `pip install armature-studio`, and
        # the thing this room exists to exercise) at the unbounded specifiers pyproject
        # declares -- so when this step goes red on release day, after `release: published`
        # has fired, the log has to say which numpy and which cv2 the probe ran against.
        # Measured on the rig 2026-09-04: `pip install --quiet` emitted nothing at all, while
        # the same install without the flag printed `Successfully installed
        # armature-studio-0.3.0`. `pip freeze` after each install is the full answer: a
        # dependency-day break and a wheel defect are then two different reds.
        python -m venv /tmp/cleanroom-sdist
        /tmp/cleanroom-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
        /tmp/cleanroom-sdist/bin/python -m pip freeze
        /tmp/cleanroom-sdist/bin/armature modules --json > /dev/null
        python -m venv /tmp/cleanroom
        /tmp/cleanroom/bin/python -m pip install dist/*.whl
        /tmp/cleanroom/bin/python -m pip freeze
        /tmp/cleanroom/bin/armature check
        /tmp/cleanroom/bin/armature modules --json > /dev/null
        # THE PROBE IS A FILE, NOT A HEREDOC, for the reason the classifier gate beside it is
        # one: `verify.ps1`'s leg 3 runs the SAME text, and a copy forks. Its own docstring
        # carries the measurement (one copy gutted, 256 tests still green) and the reason the
        # printed line is BUILT from the calls rather than written as a literal.
        /tmp/cleanroom/bin/python "$GITHUB_ACTION_PATH/lazy_import_probe.py"

    # THE ONE FAILURE CLASS THIS PROJECT HAS ALREADY PAID FOR, AND THE ONLY GATE THAT CAN
    # SEE IT. `twine check` above validates metadata STRUCTURE, not classifier MEMBERSHIP:
    # measured 2026-09-04 on a `git archive` copy of this tree with `Topic :: Scientific ::
    # Image Processing` (the row PyPI 400'd this project's first upload on, recorded in
    # `pyproject.toml:70-72`) added back beside the valid ones, `python -m build` produced
    # both artifacts with no warning and `python -m twine check dist/*` printed PASSED for
    # the wheel AND the sdist and exited 0. So the step above, `verify.ps1`'s leg 3 and every
    # green suite would be green on a wheel PyPI will refuse -- and the 400 would arrive
    # inside `pypa/gh-action-pypi-publish` on a tag already cut and public, while the `npm`
    # job, a sibling on `needs: verify` running in PARALLEL, published successfully. This
    # gate is upstream of that fork for the reason the visibility gate was hoisted upstream
    # of it.
    #
    # THE CHECK IS A FILE, NOT A HEREDOC: `verify.ps1`'s leg 3 calls the SAME file, so the
    # local leg and the release gate cannot fork the way the font dependency did one
    # directory over, and the way the sdist room did in this very action. This header's own
    # first paragraph is the law being followed.
    #
    # WHY THE CEILING IS A YEAR, AND THE ARGUMENT THAT LOST. This step first shipped
    # `trove-classifiers>=2026.6.1.19` with NO ceiling, on the reasoning that `build` and
    # `twine` are pinned because they PRODUCE the artifact while this one produces nothing --
    # it is a DATA snapshot of PyPI's vocabulary, and a ceiling freezes this gate's idea of
    # that vocabulary. The suite refused it:
    # `tests/test_ci_workflows.py::test_every_tool_that_makes_or_moves_the_artifact_is_bounded_from_above`
    # walks every install token in every job that produces or publishes a distribution and
    # requires a bound from ABOVE, and it named this one in all three sources (ci.yml:
    # python-tests, release.yml: verify, verify.ps1). The census is right and the reasoning
    # was wrong on the axis it was arguing: the repo's law is that the code -- and the data --
    # running on release day must be the code that was verified, and a list resolved fresh on
    # the day is neither. Both readings fail in the SAME direction anyway: an out-of-date list
    # refuses a valid new classifier, and a fresh one refuses a row PyPI has deprecated;
    # neither can let a bad row through, and both are fixed by a deliberate edit here.
    # `>=2026.6.1.19` is the version this rig resolved and ran with the network on 2026-09-04;
    # `<2027` is a CalVer year, so bumping it is the same deliberate act raising `npm@^11.5.1`
    # already is.
    - name: refuse a classifier PyPI does not have
      shell: bash
      run: |
        set -eu
        python -m pip install "trove-classifiers>=2026.6.1.19,<2027"
        python "$GITHUB_ACTION_PATH/classifier_gate.py" dist
