# Monthly re-resolve for Actions SHA pins. Workflows pin digests (not floating tags);
# Dependabot opens a reviewable PR that bumps the digest and the version comment together.
# Publish-path actions stay SHA-pinned — this file does not switch them to moving tags.
#
# pip ecosystem: pyproject.toml Requires-Dist floors (numpy / pillow / opencv /
# matplotlib and friends). Monthly grouped PRs propose version moves; lower bounds stay
# honest with the CI matrix. No lockfile at repo root yet — pip-audit still resolves the
# installed env in CI; a constraints file is an optional follow-up so both share one graph.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns:
          - "*"

  # npm/site: security updates only. `open-pull-requests-limit: 0` switches OFF
  # version updates for this ecosystem, so this adds no routine PR volume -- it
  # exists purely to GROUP the security PRs GitHub opens regardless of config.
  #
  # Ungrouped, each advisory gets its own PR while `npm audit --audit-level=high`
  # in ci.yml audits the whole lockfile. Four concurrent /site advisories (astro
  # critical, sharp/js-yaml/svgo high) therefore produced four PRs that each
  # still reported the other three, so none could ever go green. Grouping makes
  # one PR that clears them together.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      site-security:
        applies-to: security-updates
        patterns:
          - "*"
