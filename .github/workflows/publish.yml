# Publishing armature — PyPI and npm, from a tag, by OIDC.
#
# WHY THIS RUNS ON `release: published` AND NOTHING ELSE. Publishing is irreversible:
# a version number, once taken on either registry, is taken forever. A push trigger
# would make every commit a candidate for that. The release event is a deliberate human
# act, which is the only thing that should be able to reach a registry.
#
# WHY THERE ARE NO TOKENS HERE. Both jobs authenticate by OIDC (Trusted Publishing), so
# no long-lived credential exists to leak from this repository or from any developer's
# machine. `id-token: write` is what mints the short-lived one, per job, at publish time.
#
# ONE-TIME SETUP, on the registries themselves — until both are done this workflow will
# fail at the publish step by design rather than fall back to a token:
#   PyPI  → project `armature-previz` → Publishing → add a GitHub publisher:
#           owner mcp-tool-shop-org · repo armature · workflow publish.yml
#   npm   → @mcptoolshop/armature → Settings → Trusted publisher → same three values.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate. Neither registry is reached until the suite passes on the tagged tree and
  # the built artifacts have been checked — a broken publish cannot be taken back.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest numpy
      - name: Suite
        run: python -m pytest -q
      - name: Suite under -O
        run: python -O -m pytest -q
      - name: Build
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: The version in the tag must equal the version in the package
        # A tag that disagrees with the metadata publishes a version nobody asked for.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NPM=$(node -p "require('./npm/package.json').version")
          echo "tag=$TAG pyproject=$PKG npm=$NPM"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != pyproject $PKG"; exit 1; }
          fi
          [ "$PKG" = "$NPM" ] || { echo "::error::pyproject $PKG != npm $NPM"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Launcher self-test
        # Runs where Python is irrelevant: it proves the launcher parses and reports
        # honestly, which is the half of it that must work before Python is even looked for.
        run: npm test
        working-directory: npm
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: npm
