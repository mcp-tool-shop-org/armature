# Studio Actions rules binding: ubuntu-latest only, paths-gated (never "all
# pushes"), workflow_dispatch fallback, and the required concurrency block.
#
# Pages deployment is NO LONGER an open question — it was ruled and it lives in
# pages.yml. See docs/dispatches/S01-ruling.md §2 for the measurement (71 of 71
# deploying repos in this org use a workflow build) and why a third workflow
# file is correct here despite the two-file cap.
#
# `release.yml` stays reserved for the PyPI Trusted Publisher: OIDC
# authenticates the workflow FILENAME (docs/publishing.md).
#
# EVERY `uses:` IN THIS REPOSITORY IS PINNED TO A COMMIT SHA, `actions/*` included. Until
# 2026-09-04 only `pypa/gh-action-pypi-publish` was, under a comment stating the law in
# general terms — "a ref that resolves at run time means the code performing the step is not
# the code last reviewed" — while the guard that enforced it filtered the whole `actions/`
# owner out of its population without saying why. That exemption covered the checkout and
# setup-node that run in the SAME job as `npm publish --provenance` under `id-token: write`,
# and the deploy-pages that performs the Pages deployment.
#
# Each SHA is the newest tag WITHIN the major already in use — a pin, not an upgrade —
# resolved on 2026-09-04 with `gh api repos/<action>/tags` and `git/ref/tags/<tag>`,
# dereferenced where the tag was annotated. Never typed from memory: a plausible-looking
# hash with a version beside it would be a placeholder shaped like evidence. Bump
# deliberately, by re-resolving; the `# vX.Y.Z` comment is what makes the bump reviewable.
name: ci

on:
  push:
    paths:
      - "site/**"
      - "tools/**"
      - "tests/**"
      # `.github/actions/**` beside `.github/workflows/**`. Wave 6 moved the font install
      # OUT of the two workflows and INTO `.github/actions/sheet-fonts/action.yml`, which
      # ci.yml and release.yml both now depend on — and it moved out from under the only filter that
      # covered it. Measured before this line changed, by evaluating the suite's own
      # `_on_block()` over every workflow: `.github/actions/sheet-fonts/action.yml` -> NO
      # WORKFLOW RUNS. A renamed face or a dropped `apt-get update` would have reached main
      # green-by-absence and first surfaced in release.yml, after `release: published`.
      - ".github/workflows/**"
      - ".github/actions/**"
      # The packaging manifests. Added at v0.2.0: without these a change to
      # pyproject.toml or the launcher could reach a tag having never been built,
      # and the first place that failure would surface is the release job — after
      # the tag exists and while a registry is waiting.
      #
      # README.pypi.md and LICENSE are the SAME failure, left open at v0.2.0 and
      # measured since: pyproject names both (`readme` and `license.file`), the
      # sdist ships both, and the wheel METADATA carries the licence text and the
      # long description from them. Neither matched any filter, so renaming or
      # deleting one triggered no CI run at all. Every file the package is built
      # from now builds the package; tests/test_ci_workflows.py reads the list out
      # of pyproject, so a rename moves the requirement with it.
      - "pyproject.toml"
      - "MANIFEST.in"
      - "npm/**"
      - "README.pypi.md"
      - "LICENSE"
      # The files the WORKFLOWS are built from, and the rest of what the suite opens by
      # path. `tests/test_ci_workflows.py` derives this population by walking every
      # `os.path.join` in `tests/**` and resolving it against the tree, so a test that
      # starts reading a new repo file fails there — naming the file and the filter it
      # needs — instead of being guarded by a job that never runs on it. verify.ps1 and
      # .gitignore each have a test file of their own and matched nothing at all.
      - "verify.ps1"
      - ".gitignore"
      # Named by tests/test_record_index_binding.py's fixtures: the record index binds
      # these two documents, so a rename or a move is a change the suite has an opinion
      # about and CI must run on.
      - "HANDOFF.md"
      - "README.md"
      - "specs/**"
      - "docs/experiments/**"
      - "docs/index/**"
      # The licence map. `docs/license-map.md` is the verified map the repo's licence gate
      # is written against, and the suite now OPENS it by path: core-gates' licence-table
      # census parses its rows and resolves the Commercial column against
      # `RULED_COMPONENTS`. A re-fetch that adds or retires a kill is exactly the change CI
      # must run on — the licence gate is a CLAUDE.md non-negotiable, and a guard that does
      # not run on the change it guards is the shape this filter list exists to close.
      - "docs/license-map.md"
      # The two documents the suite reads that live one directory DOWN. The census above
      # keys on `git ls-files -- :(top)` -- repo-ROOT tracked files -- so nothing under a
      # subdirectory could ever enter it, and these two were consumed and triggered nothing.
      #
      # `docs/research-grounding.md`: `tests/test_openpose_convention.py` asserts the document
      # still carries F20's limbSeq verbatim, so editing it turns CI red. It matched no filter
      # in either list, so the edit ran no CI at all and the red first surfaced on somebody
      # else's unrelated push. `tests/test_ci_workflows.py` derives this requirement by
      # resolving every `docs/` path expression under `tests/` -- including the Call-rooted
      # `os.path.join(<call>, "docs", "research-grounding.md")` form this file uses, which a
      # walk keyed on a path CONSTANT root resolves nothing for.
      #
      # `docs/assets/**`: the three committed figures `tests/test_packaging.py` holds
      # `.gitignore`'s `!docs/assets/**` negation to, plus the rule that no negation may point
      # at a path the tree does not have. A docs-only commit that removes that directory kills
      # the negation and turns the suite red, and until this line ran nothing.
      - "docs/research-grounding.md"
      - "docs/assets/**"
  pull_request:
    paths:
      - "site/**"
      - "tools/**"
      - "tests/**"
      # `.github/actions/**` beside `.github/workflows/**`. Wave 6 moved the font install
      # OUT of the two workflows and INTO `.github/actions/sheet-fonts/action.yml`, which
      # ci.yml and release.yml both now depend on — and it moved out from under the only filter that
      # covered it. Measured before this line changed, by evaluating the suite's own
      # `_on_block()` over every workflow: `.github/actions/sheet-fonts/action.yml` -> NO
      # WORKFLOW RUNS. A renamed face or a dropped `apt-get update` would have reached main
      # green-by-absence and first surfaced in release.yml, after `release: published`.
      - ".github/workflows/**"
      - ".github/actions/**"
      # The packaging manifests. Added at v0.2.0: without these a change to
      # pyproject.toml or the launcher could reach a tag having never been built,
      # and the first place that failure would surface is the release job — after
      # the tag exists and while a registry is waiting.
      #
      # README.pypi.md and LICENSE are the SAME failure, left open at v0.2.0 and
      # measured since: pyproject names both (`readme` and `license.file`), the
      # sdist ships both, and the wheel METADATA carries the licence text and the
      # long description from them. Neither matched any filter, so renaming or
      # deleting one triggered no CI run at all. Every file the package is built
      # from now builds the package; tests/test_ci_workflows.py reads the list out
      # of pyproject, so a rename moves the requirement with it.
      - "pyproject.toml"
      - "MANIFEST.in"
      - "npm/**"
      - "README.pypi.md"
      - "LICENSE"
      # The files the WORKFLOWS are built from, and the rest of what the suite opens by
      # path. `tests/test_ci_workflows.py` derives this population by walking every
      # `os.path.join` in `tests/**` and resolving it against the tree, so a test that
      # starts reading a new repo file fails there — naming the file and the filter it
      # needs — instead of being guarded by a job that never runs on it. verify.ps1 and
      # .gitignore each have a test file of their own and matched nothing at all.
      - "verify.ps1"
      - ".gitignore"
      # Named by tests/test_record_index_binding.py's fixtures: the record index binds
      # these two documents, so a rename or a move is a change the suite has an opinion
      # about and CI must run on.
      - "HANDOFF.md"
      - "README.md"
      - "specs/**"
      - "docs/experiments/**"
      - "docs/index/**"
      # The licence map. `docs/license-map.md` is the verified map the repo's licence gate
      # is written against, and the suite now OPENS it by path: core-gates' licence-table
      # census parses its rows and resolves the Commercial column against
      # `RULED_COMPONENTS`. A re-fetch that adds or retires a kill is exactly the change CI
      # must run on — the licence gate is a CLAUDE.md non-negotiable, and a guard that does
      # not run on the change it guards is the shape this filter list exists to close.
      - "docs/license-map.md"
      # The two documents the suite reads that live one directory DOWN. The census above
      # keys on `git ls-files -- :(top)` -- repo-ROOT tracked files -- so nothing under a
      # subdirectory could ever enter it, and these two were consumed and triggered nothing.
      #
      # `docs/research-grounding.md`: `tests/test_openpose_convention.py` asserts the document
      # still carries F20's limbSeq verbatim, so editing it turns CI red. It matched no filter
      # in either list, so the edit ran no CI at all and the red first surfaced on somebody
      # else's unrelated push. `tests/test_ci_workflows.py` derives this requirement by
      # resolving every `docs/` path expression under `tests/` -- including the Call-rooted
      # `os.path.join(<call>, "docs", "research-grounding.md")` form this file uses, which a
      # walk keyed on a path CONSTANT root resolves nothing for.
      #
      # `docs/assets/**`: the three committed figures `tests/test_packaging.py` holds
      # `.gitignore`'s `!docs/assets/**` negation to, plus the rule that no negation may point
      # at a path the tree does not have. A docs-only commit that removes that directory kills
      # the negation and turns the suite red, and until this line ran nothing.
      - "docs/research-grounding.md"
      - "docs/assets/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stated, not inherited. This is the workflow that executes the most third-party code —
# `npm ci` over site/'s whole lockfile and every lifecycle script in it, four `pip install`
# lines including one inside a clean-room venv, and an apt install — and until v0.3.1 it was
# the only one of the three that handed all of that a GITHUB_TOKEN whose scope this
# repository never stated. pages.yml and release.yml both declare theirs; the guard that was
# supposed to cover this one skipped it, because a job with no block of its own was read as
# inheriting a workflow-level grant that did not exist here.
#
# `contents: read` is the whole requirement: both jobs only read the tree. Nothing here
# writes a commit, a release, a package or a comment.
permissions:
  contents: read

jobs:
  # Skipped only where another job already covers the same bytes: on a push to MAIN,
  # pages.yml builds site/ before deploying it, and it now runs the dependency scan too.
  #
  # The condition used to be the bare `github.event_name != 'push'`, and the comment claimed
  # the skip cost "no coverage". Enumerated, that was false by exactly one step: pages.yml ran
  # `npm ci` and `npm run build` and nothing else, while this job also runs the repo's only
  # dependency scan. Two holes followed, both on the direct-push path this repo actually uses
  # — a push to main bumping site/package-lock.json was scanned nowhere, and a push to any
  # OTHER branch matched neither pages.yml's `branches: [main]` nor this job, so site/ was
  # built nowhere at all until a PR was opened. tests/test_ci_workflows.py now evaluates this
  # very expression against each way a lockfile change can arrive.
  site-build:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm audit + ci + site build: minutes on a warm runner; 15 bounds a hung install.
    # Platform default without this key is 360 (docs.github.com, fetched 2026-09-06).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # BEFORE the install, not after it. site/ is the npm lockfile surface; the Python
      # runtime set is audited separately in `python-tests` (`pip-audit` on the installed
      # env). This step used to claim "the whole scannable surface" while the pip graph was
      # never scanned. It ran third, after `npm ci`, and `npm ci` runs every lifecycle
      # script in the resolved tree by default: the gate could name a compromised
      # dependency but not stop it from having had a shell on the runner.
      # `--package-lock-only` reads the committed lockfile and needs no node_modules, so the
      # scan is the first thing that touches site/. `high` is the studio's threshold; a
      # build-time low is not worth a red main.
      - name: scan site dependencies
        working-directory: site
        run: npm audit --package-lock-only --audit-level=high

      # `npm ci` and not `npm install`: the lockfile is committed, and a build
      # that resolves fresh dependencies is not the build that was verified on
      # the rig. If this step fails on a lockfile mismatch, that IS the signal.
      - name: install site dependencies
        working-directory: site
        run: npm ci

      - name: build site
        working-directory: site
        run: npm run build

  # E01's suite. The Blender-dependent tests carry
  # `pytest.mark.skipif(not os.path.isfile(BLENDER))`, so on a runner with no
  # Blender they SKIP VISIBLY rather than passing silently — the skip count in
  # the log is the honest record of what this runner could not exercise.
  # Blender-side coverage is the rig's job, not CI's.
  python-tests:
    runs-on: ubuntu-latest
    # Suite twice (plain + -O) plus two clean rooms. 3.13 finishes in ~27 min; 3.11's
    # -O leg was canceled at 45 min on a1a4b0a (first suite green, -O still running).
    # 90 bounds a hung pip without cutting the slower floor interpreter off mid-leg.
    timeout-minutes: 90
    strategy:
      # The two ENDS of the interval pyproject promises: 3.11 is `requires-python`'s floor
      # and 3.13 is the highest classifier. Until v0.3.2 there was no matrix at all and the
      # single job ran 3.13, so every version below it was a public promise nothing ran —
      # and the end that matters is the floor, because a version below the exercised one is
      # an extrapolation rather than an interpolation. The floor came UP to 3.11 in the same
      # change: two files in the suite import `tomllib`, which landed in 3.11, so the suite
      # that would prove 3.10 cannot collect on it. Two entries, inside the studio rule's
      # 2-3 Python versions and 6-job cap. tests/test_ci_workflows.py reads the interval out
      # of pyproject, so narrowing or widening the promise moves this matrix with it.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Rehearsal obligation is CI-reachable: release.yml's STATUS line must name a completed
      # Actions run that still matches the current gate set — not NOT YET RUN, not STALE,
      # and not the pre-pip-audit id 34073888719. A live release:published refuses the same
      # shapes; this step makes the debt visible on every PR rather than only after a tag
      # is cut. Cleared when STATUS is rewritten to STATUS: RUN <id> after re-dispatch.
      # GATE BEFORE SPEND: sits on the checkout+python floor, before pip / suite / clean-room
      # / npm pack — a run that will refuse is refused before the job is paid for.
      - name: release.yml rehearsal STATUS must be recorded
        run: |
          set -eu
          # Header STATUS comment only — not this step's own error text.
          if grep -E -q '^[[:space:]]*#[[:space:]]*STATUS:[[:space:]]*NOT YET RUN\b' .github/workflows/release.yml; then
            echo "::error::release.yml header STATUS is still unset; rehearse before the next live release."
            echo "::error::gh workflow run release.yml --ref <tag-carrying-actions> -f rehearse=true"
            exit 1
          fi
          if grep -E -q '^[[:space:]]*#[[:space:]]*STATUS:[[:space:]]*STALE\b' .github/workflows/release.yml; then
            echo "::error::release.yml header STATUS is STALE; re-dispatch after the gate-set change."
            echo "::error::gh workflow run release.yml --ref <tag-carrying-actions> -f rehearse=true"
            exit 1
          fi
          if grep -E -q '^[[:space:]]*#[[:space:]]*STATUS:[[:space:]]*RUN[[:space:]]+34073888719\b' .github/workflows/release.yml; then
            echo "::error::release.yml STATUS still names pre-pip-audit rehearsal 34073888719."
            echo "::error::Re-dispatch after pip-audit and rewrite STATUS with the new run id."
            exit 1
          fi
          echo "STATUS line is recorded and fresh."

      # opencv is pinned to the rig's verified version: the aapose golden-frame
      # tests assert byte-stable rasterization, and the rasterizer's version is
      # the axis that matters. Headless build — no GUI stack on a runner.
      #
      # `build` is in THIS list, before the suite, and not only in the clean-room action
      # that runs after it. `tests/test_packaging.py` builds an sdist by subprocess to pin
      # what the published archive carries — the whole point of the MANIFEST.in fix-up —
      # and with the tool absent those two assertions skipped, in CI and in the release
      # gate both. `twine check dist/*` reads metadata and never opens the archive, so
      # nothing else here would have noticed the sdist regressing. The specifier is the
      # clean-room action's, character for character; a test holds every copy to one string.
      - name: install test dependencies
        run: python -m pip install --upgrade pip numpy pillow pytest opencv-python-headless==5.0.0.93 matplotlib==3.11.1 "build>=1.5,<2" "requests>=2.32,<3"

      # Python dependency audit on the environment that mirrors `[project] dependencies` /
      # the `[dev]` pins just installed. site/'s `npm audit --audit-level=high` is the npm
      # half; this is the pip half. `pip-audit` has no `--audit-level=high` (upstream has no
      # severity floor flag); it fails on any known advisory in the resolved env — at least
      # as strict as npm's `high`. Ceiling on the tool itself so release day cannot pick up
      # a new major of the auditor.
      - name: audit Python dependencies
        run: |
          # The hosted interpreter ships setuptools 79.0.1 (PYSEC-2026-3447, fix 83.0.0).
          # pip-audit inspects the whole env, not only extras, so upgrade before the audit.
          python -m pip install "setuptools>=83.0.0,<84" "pip-audit>=2.7,<3"
          python -m pip_audit --progress-spinner off

      # The sheet composers resolve a real font (Arial → Liberation Sans → Noto Sans, all
      # licence-verified) or refuse by name; nothing is bundled, because a font is a binary
      # and the licence gate applies to fonts too. Liberation is installed explicitly rather
      # than inherited from whatever the runner image happens to carry.
      #
      # WHAT THIS STEP ACTUALLY DOES, corrected in place with the measurement that overturned
      # the earlier sentence. It read "so the 23 sheet tests that used to skip on CI run
      # against a font the repo chose", and two of those three claims are false. Collected in
      # a worktree 2026-09-05, `tests/test_sheet_compose.py` + `tests/test_make_shotset_sheet.py`
      # are 29 tests, not 23; and they do not skip on font absence at all — both modules'
      # `pytestmark` skip condition is `not pil_has_a_scalable_font()`, a Pillow capability
      # check, and the `sheet_fonts` fixture substitutes PIL's bundled scalable face whenever
      # the module's own resolver refuses. So this step UN-SKIPS NOTHING. It supplies the
      # permitted face to the two tests that drive `rig_sheet_compose` and `make_cast_sheet`
      # outside that fixture's reach — where it is load-bearing — and it keeps the other 27
      # measuring the repo's chosen face rather than PIL's fallback. The number is not
      # derived here on purpose: it is a count of tests in two modules, not a property of
      # this step, and `tests/test_ci_workflows.py` already derives the FACES this action
      # must install from `sheet_compose.FONT_ALIASES`, which is the requirement that can
      # actually go stale.
      #
      # The step lives in a composite action because release.yml's verify job runs the SAME
      # suite and needs the SAME face: two copies of one dependency list is how that job came
      # to run the suite with no font at all. tests/test_ci_workflows.py holds every job that
      # runs pytest to calling this action.
      - uses: ./.github/actions/sheet-fonts

      - name: run tests
        run: python -m pytest tests -q

      # The ANDON tests assert that G1 still raises under `python -O` and
      # PYTHONOPTIMIZE=1. Running the suite a second time under -O is what
      # proves the gate is not an `assert` the interpreter is licensed to
      # delete — 87 of facet's ANDONs were removable by an environment
      # variable, and this repo does not add the 88th.
      - name: run tests under -O (gates must still raise)
        run: python -O -m pytest tests -q
        env:
          PYTHONOPTIMIZE: "1"

      # The package must build and install on every change that could break it, not first
      # at release time. The leg lives in a composite action because release.yml's verify
      # job must run the SAME leg on the SAME artifact it is about to publish, and two
      # copies of one gate is how the font dependency forked. What the leg does, and why
      # `armature check` alone was not enough, is written in the action.
      - uses: ./.github/actions/clean-room

      # THE NODE→PYTHON HANDOFF, once per PR, on the artifact the wheel room just installed.
      # ci.yml's `launcher` job packs the tarball and runs `--node-selftest` with no Python;
      # that half cannot see a broken `-m armature_core.cli` spawn. clean-room leaves its
      # wheel room at `$RUNNER_TEMP/cleanroom` (removed only at the START of a later call),
      # so the packed shim and an installed wheel meet here under ARMATURE_PYTHON. The
      # runner's preinstalled node/npm pack; no setup-node. Pin note for tests: this job
      # joins `npm_pack_jobs()` beside `launcher` — coordinator re-derives NPM_PACK_JOBS_TODAY.
      - uses: ./.github/actions/npm-clean-room
        with:
          python: ${{ runner.temp }}/cleanroom/bin/python

  # The launcher is Node, not Python, and it ran as a step of the Python job on one version.
  # `npm/package.json` declares `"node": ">=18"` — a promise npm enforces on a user's machine
  # at install time — and nothing ran 18. Its own job with a 2-entry matrix costs less than
  # a second axis on python-tests and keeps the file inside the studio 6-job cap: site-build,
  # python-tests x2, launcher x2.
  launcher:
    runs-on: ubuntu-latest
    # Node self-test only; minutes. Platform default without this key is 360
    # (fetched 2026-09-06).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      # `npm test` is `node bin/armature.mjs --node-selftest`: it proves the launcher parses
      # and reports honestly, which is the half of it that must work before Python is even
      # looked for.
      #
      # THIS JOB IS THE ONLY PLACE `npm test` RUNS. The line here read "release.yml runs the
      # same command in its publish job" and that has not been true since the `Launcher
      # self-test` step was deleted from release.yml's `npm` job: re-measured on `63191ee`,
      # `grep -n -E 'npm test|self-?test' .github/workflows/release.yml` returns COMMENT LINES
      # ONLY — no `run: npm test` and no such step anywhere in the file. release.yml records
      # the deletion itself ("NO GATE LIVES DOWNSTREAM OF THE FORK… `npm test` itself is not
      # retired: ci.yml's `launcher` job still runs it"), so the file that no longer has the
      # step knew, and this citation did not move with it — pointing the wrong way round, the
      # holder of the only copy claiming the other file held one too.
      #
      # What release.yml's `verify` job DOES run is `./.github/actions/npm-clean-room`, which
      # packs the package, installs the TARBALL into a scratch prefix and runs
      # `"$SHIM" --node-selftest` on the INSTALLED shim — a strictly stronger artifact, and
      # upstream of the publish fork, where every gate in that file now lives. So this job's
      # 2-entry node matrix is the only checkout-level launcher coverage in the repository,
      # and trimming it under the CI-minutes rule would remove it entirely.
      #
      # THE FACT IS PINNED, AND THE PIN IS DERIVED.
      # `tests/test_ci_workflows.py::test_npm_test_runs_only_where_it_is_measured_to_run`
      # walks every `run:` script under `.github/` through `_code_only` and holds the sources
      # that EXECUTE `npm test` to `NPM_TEST_SOURCES_TODAY = ["ci.yml"]`, so deleting this
      # step, or adding one back to release.yml, turns the suite red and brings a reader here.
      # What is NOT asserted, stated so the next seat does not assume it: there is no census
      # parsing coverage comments in general. That form was attempted and withdrawn -- every
      # regex shape flagged this very paragraph, which names `npm test`, `run: npm test`,
      # ci.yml and release.yml in ordinary prose. The pin is a claim about the code; the
      # sentences above it are the reasoning, and only the pin is enforced.
      - name: launcher self-test
        working-directory: npm
        run: npm test

      # `npm test` runs the launcher out of the CHECKOUT and consults neither `bin`, `files`
      # nor the tarball. The npm package is published irreversibly by release.yml and, until
      # this wave, was the one artifact never installed anywhere in this repository — the
