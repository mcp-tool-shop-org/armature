# Deploys site/ to GitHub Pages. Adapted from facet's pages.yml, retrieved
# verbatim 2026-08-10 rather than authored fresh.
#
# ⚠ WHY A THIRD WORKFLOW FILE EXISTS HERE, since the studio rule caps a repo at
# two: the cap's stated purpose is CI-minute control and its worked example is
# ci + publish — it does not contemplate a Pages deploy. Measured at ruling
# time: of 89 repos in this org, 71 have Pages and ALL 71 use build_type
# "workflow". facet runs exactly ci.yml + pages.yml + release.yml. A rule that
# every deploying repo in the org breaks is mis-scoped, not enforced.
# Ruled approved in docs/dispatches/S01-ruling.md §2.
#
# `release.yml` is NOT available for this job: its filename is authenticated by
# PyPI's Trusted Publisher OIDC and cannot be repurposed (docs/publishing.md).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci`, not `npm install`: the lockfile is committed, so the build
      # that runs here is the build verified on the rig.
      - name: install site dependencies
        working-directory: site
        run: npm ci

      - name: build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    # Skipped while the repo is private: Pages went dark with the repo on
    # 2026-08-11, and deploy-pages 404s against a Pages that does not exist
    # (measured 2026-08-13, run 31726592984 — the first site/** push since the
    # visibility change). The build job above stays load-bearing as the site's
    # CI; deploys resume by themselves if the repo goes public again.
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
