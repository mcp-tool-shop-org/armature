# Deploys site/ to GitHub Pages. Adapted from facet's pages.yml, retrieved
# verbatim 2026-08-10 rather than authored fresh.
#
# ⚠ WHY A THIRD WORKFLOW FILE EXISTS HERE, since the studio rule caps a repo at
# two: the cap's stated purpose is CI-minute control and its worked example is
# ci + publish — it does not contemplate a Pages deploy. Measured at ruling
# time: of 89 repos in this org, 71 have Pages and ALL 71 use build_type
# "workflow". facet runs exactly ci.yml + pages.yml + release.yml. A rule that
# every deploying repo in the org breaks is mis-scoped, not enforced.
# Ruled approved in docs/dispatches/S01-ruling.md §2.
#
# `release.yml` is NOT available for this job: its filename is authenticated by
# PyPI's Trusted Publisher OIDC and cannot be repurposed (docs/publishing.md).
#
# The `uses:` refs are pinned to commit SHAs within the major they already used, resolved
# with the network on 2026-09-04; the reasoning and the method are in ci.yml's header.
# `deploy-pages` is the step that replaces what the public sees, so a ref of its that
# resolved at run time was the sharpest instance of the gap.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# DECIDED, and written down, which is the half that was missing. `cancel-in-progress` is
# WORKFLOW-level: a second push to main touching site/** cancels the first run wherever it
# is, INCLUDING inside `actions/deploy-pages` below — the step this file's header calls the
# one that replaces what the public sees. Two quick site pushes could therefore leave a Pages
# deployment cancelled part-way, the live site on the older build, and the cancelled run GREY
# rather than red: a deploy that did not happen with nothing reporting a failure. A job-level
# concurrency block does not close this, because workflow-level cancellation cancels the
# whole run regardless.
#
# So this queues rather than cancels, the way release.yml already does for the same reason —
# its steps cannot be taken back either. This is a deliberate deviation from the studio
# Actions rule, which mandates `cancel-in-progress: true`; GitHub's own Pages guidance is the
# documented exception, and the cost is a superseded build finishing before the next one
# starts. `tests/test_ci_workflows.py` now states the rule in terms of the ACT rather than
# the filename: a workflow that performs something irreversible queues, everything else
# cancels, with both step spellings (`uses:` an action, `run:` a script) in the census.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `contents: read` is the whole workflow-level grant, and the two scopes that can change
# what the public sees live on the ONE job that uses them. Both jobs used to carry all three:
# the `build` job below runs `npm ci` over site/'s whole lockfile — every install lifecycle
# script in the resolved tree — while holding a token able to create a Pages deployment, so a
# compromised transitive dependency could replace the front door from a build job. ci.yml's
# own permissions comment names this threat model and release.yml puts `id-token: write` on
# its two publish jobs alone; this file skipped the narrowing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # npm audit + ci + site build: minutes; 15 bounds a hung install. Platform default
    # without this key is 360 (docs.github.com, fetched 2026-09-06).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # ci.yml's dependency scan, the same command verify.ps1 runs locally, and BEFORE the
      # install for the same reason it is first there: `npm ci` runs every lifecycle script
      # in the resolved tree, and this job ran them under `pages: write` and `id-token:
      # write` until those scopes moved onto the deploy job. This job had `npm ci` and `npm
      # run build` and nothing else, while ci.yml's site-build — the job that DOES scan —
      # was skipped on every push, so a push to main that bumped site/package-lock.json
      # built and DEPLOYED it with no scan having run anywhere. site/ is the repo's only
      # dependency manifest, so this is the whole scannable surface.
      - name: scan site dependencies
        working-directory: site
        run: npm audit --package-lock-only --audit-level=high

      # `npm ci`, not `npm install`: the lockfile is committed, so the build
      # that runs here is the build verified on the rig.
      - name: install site dependencies
        working-directory: site
        run: npm ci

      - name: build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    # Two clauses, and the workflow refuses if either fails.
    #
    # `private == false`: skipped while the repo is private. Pages went dark with the repo on
    # 2026-08-11, and deploy-pages 404s against a Pages that does not exist (measured
    # 2026-08-13, run 31726592984 — the first site/** push since the visibility change). The
    # build job above stays load-bearing as the site's CI; deploys resume by themselves if the
    # repo goes public again.
    #
    # `github.ref == 'refs/heads/main'`: the push trigger is fenced to `branches: [main]`, but
    # `workflow_dispatch` carries no ref condition at all — so a dispatch at ANY branch built
    # that branch's site/ and handed it to `actions/deploy-pages`, the step this file's header
    # calls "the step that replaces what the public sees". release.yml was hardened for exactly
    # this shape: its tag gate is unconditional and refuses a non-tag `GITHUB_REF` before any
    # publishing job runs, on the reasoning that `workflow_dispatch` must stay re-runnable but
    # must fail closed on the ref. This is that clause, for this file. A dispatch from a branch
    # still BUILDS — which is the useful half — and never deploys.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # One deploy-pages action. Platform default without this key is 360
    # (fetched 2026-09-06).
    timeout-minutes: 10
    # A job-level block REPLACES the workflow-level grant, so this job has no `contents`
    # scope at all — deliberately: its one step performs the deployment and never clones.
    # (release.yml's `npm` job is the same rule in the other direction: it re-declares
    # `contents: read` beside `id-token: write` precisely because its step 1 IS a checkout.)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
