# Publishing armature — PyPI and npm, from a tag, by OIDC.
#
# WHY THIS RUNS ON `release: published` AND NOTHING ELSE. Publishing is irreversible:
# a version number, once taken on either registry, is taken forever. A push trigger
# would make every commit a candidate for that. The release event is a deliberate human
# act, which is the only thing that should be able to reach a registry.
#
# WHY THERE ARE NO TOKENS HERE. Both jobs authenticate by OIDC (Trusted Publishing), so
# no long-lived credential exists to leak from this repository or from any developer's
# machine. `id-token: write` is what mints the short-lived one, per job, at publish time.
#
# ONE-TIME SETUP, on the registries themselves — until both are done this workflow will
# fail at the publish step by design rather than fall back to a token:
#   PyPI  → pending publisher for project `armature-studio`:
#           owner mcp-tool-shop-org · repo armature · workflow release.yml   [DONE 2026-08-15]
#   npm   → trusted publisher for `@mcptoolshop/armature-studio`: same three values.
#
# The publisher's project name and workflow FILENAME are both matched byte-for-byte at
# authentication time. That is why this file is `release.yml` and not `publish.yml`, and
# why the packages were renamed before the first publish rather than after it.
#
# WHY EVERY `uses:` HERE IS A SHA. The PyPI publish action carried the only pin, and the
# comment beside it stated the law in general terms while the `actions/*` refs in this same
# file did not follow it — including the checkout and setup-node that run in the job doing
# `npm publish --provenance` under `id-token: write`. All of them are pinned now, to the
# newest tag within the major already in use, resolved with the network on 2026-09-04.
name: release

on:
  release:
    types: [published]
  # THE REHEARSAL, AND THE REF IT CANNOT BE DISPATCHED AT YET.
  #
  # Measured on this tree 2026-09-04, and the earlier form of this block understated it.
  # `git tag -l` holds swarm-save-1788481819, v0.1.0, v0.1.1, v0.2.0, v0.2.1 and v0.3.0 and
  # nothing else; `git ls-tree -r --name-only <tag> -- .github/actions` returns ZERO files
  # for EVERY ONE of the six. So it is not that the actions post-date v0.3.0 -- NO TAG IN
  # THIS REPOSITORY CARRIES ANY OF THEM. `git show v0.3.0:.github/workflows/release.yml`
  # has `workflow_dispatch:` with no `inputs:` block beneath it, no `refs/tags/` anywhere,
  # and `npm publish --provenance --access public` unconditional at its :126.
  #
  # The consequence for the tag-ref gate below, the visibility gate beside it, the
  # pre-release gate added in wave 23, `npm-clean-room`, the clean-room action's sdist and
  # classifier rooms, the `-O` step's `PYTHONOPTIMIZE` env and BOTH arms of the npm
  # `Publish` branch is unchanged: none of them has ever executed in a
  # `release: published` run. Nothing green anywhere says
  # otherwise -- the suite reads these files as TEXT, which is a claim about what they SAY,
  # not about what they DO on a runner.
  #
  # Without a rehearsal, the first real use of roughly two hundred lines of never-executed
  # shell is the one path in this repository with no compensator -- a defect in it surfaces
  # AFTER `release: published` has fired, on a tag already cut and public, with both
  # registries waiting. That is the state this file's header says the release trigger exists
  # to keep rare, not the state in which to debug a gate.
  #
  # WHY NO REF IS NAMED ON THE COMMAND BELOW. This block used to print
  # `gh workflow run release.yml --ref v0.3.0 -f rehearse=true`, and that command has only
  # two outcomes, both of which end at the publish steps rather than at a rehearsal: the
  # dispatch is refused because the workflow AT THAT REF declares no `rehearse` input, and
  # the operator's next move is the same command without it -- which runs v0.3.0's ungated
  # definition; or it is accepted and the definition executed is still v0.3.0's, where
  # `rehearse` guards nothing and `uses: ./.github/actions/*` resolves to files that do not
  # exist at that ref. The only thing between that command and a live publish today is that
  # 0.3.0 is already taken on both registries, which is not a gate. Naming ANY of the six
  # existing tags here has the same shape.
  #
  # WHY NOT `--ref main`, WHICH DOES CARRY THE GATES. The tag/ref gate refuses any
  # `GITHUB_REF` that is not `refs/tags/*`, deliberately and by its own comment ("Dispatch
  # from a branch and it refuses here"). Since wave 28 it is step 3 of the 12 steps in
  # `verify` -- checkout, setup-python, TAG GATE, visibility gate, PRE-RELEASE GATE,
  # Install, sheet-fonts, Suite, Suite under -O, clean-room, npm-clean-room,
  # upload-artifact -- because all three gates are pure shell over `GITHUB_REF`, two `env:`
  # values and the two manifests, and nothing downstream depends on their position. So a
  # `main` dispatch now refuses at step 3, before the Install line, both suite legs and both
  # clean rooms; it used to run every one of those first and refuse at step 9. Either way
  # the visibility gate, the pre-release gate and the artifact upload never run on a branch,
  # so it is still a partial run and still not what the sentence below claims -- it is not
  # the command this block prints.
  #
  # THE ORDERING, which is the actual fix: a tag alone does not fire `release: published`
  # -- creating the GitHub RELEASE object does. So the rehearsal fits BETWEEN them.
  #
  #   1. cut and push the release tag:  git tag vX.Y.Z && git push origin vX.Y.Z
  #   2. rehearse AT THAT TAG:          gh workflow run release.yml --ref vX.Y.Z -f rehearse=true
  #   3. read the run; only then:       gh release create vX.Y.Z
  #
  # At step 2 the ref is a tag AND it carries these gates, so `rehearse: true` runs the
  # whole `verify` job -- the suite twice, both clean rooms, the classifier gate, the tag
  # gate, the visibility gate -- and SKIPS both publish jobs (`if: ${{ !inputs.rehearse }}`
  # on each, so neither registry is reached and the two cannot diverge). If step 2 is red,
  # step 3 never happens and the tag is deletable; after step 3 nothing is.
  #
  # STATUS: NOT YET RUN, and no ref exists at which it could be. No run id is recorded on
  # this line because no such run exists; a plausible id beside a verdict would be a
  # placeholder shaped like evidence. Write the run id and the tag here the first time it is
  # dispatched, and dispatch again after any change to this workflow or to the actions it
  # calls, so "exercised" is a fact with a run id rather than an inference from a green
  # suite.
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Run the verify job's gates only; skip both publish jobs."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate. Neither registry is reached until the suite passes on the tagged tree and
  # the built artifacts have been checked — a broken publish cannot be taken back.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: The version in the tag must equal the version in the package
        # A tag that disagrees with the metadata publishes a version nobody asked for.
        #
        # THE COMPARISON IS UNCONDITIONAL, AND SO IS THE REF CHECK. It was neither: the tag
        # comparison sat behind `if [ event_name = release ]`, so a `workflow_dispatch` run
        # printed `tag=main pyproject=0.3.0` and PASSED, having compared nothing about the
        # tag — and both downstream jobs then publish whatever the dispatched branch's
        # manifests carry, irreversibly, off an untagged commit. The header above says the
        # release event is the only thing that should be able to reach a registry; this is
        # the check that makes that true.
        #
        # `workflow_dispatch` stays (a failed release job must be re-runnable without
        # cutting a second tag) but it now fails closed: dispatch AT THE TAG
        # (`gh workflow run release.yml --ref vX.Y.Z`) and the gate reads it like any other
        # tag ref. Dispatch from a branch and it refuses here, before any job that publishes.
        #
        # AND NOW BEFORE THE WORK, NOT ONLY BEFORE THE PUBLISH. Until wave 28 this was the
        # NINTH of the job's twelve steps: `verify` ran the Install line, the font action,
        # the suite, the suite under `-O` and both clean rooms -- two full pytest runs and
        # three clean installs, which is the whole of what this job costs -- and only then
        # read `$GITHUB_REF` and printed a one-line refusal it could have printed first.
        # Correctness was never the issue: both publish jobs sit on `needs: verify`, so a
        # refusal anywhere in this job is a refusal before a registry is reached, which is
        # what the paragraph above says. The COST was, on exactly the mis-dispatch the
        # rehearsal block in the header invites an operator to attempt, and against a studio
        # rule whose stated purpose is that CI minutes are finite.
        #
        # The three pure-shell gates therefore run immediately after `setup-python`, which is
        # the earliest point at which THIS one can run: it reads `pyproject.toml` and
        # `npm/package.json` (checkout) with `python` (setup-python) and the runner's own
        # preinstalled `node` -- the argument
        # `.github/actions/npm-clean-room/action.yml` already makes in its header for not
        # installing a node of its own. The other two need nothing but `env:` and could sit
        # above `setup-python`; they stay with this one so the three read as one andon.
        # `tests/test_ci_workflows.py` derives the order from this file and holds it: a step
        # that can refuse and does no work while deciding may not sit below a step that
        # installs, builds, packs, publishes or runs the suite.
        #
        # THE REF IS A PLACEHOLDER AND NOT A TAG THIS REPOSITORY HAS. This line read
        # `--ref v0.3.0` until 2026-09-04 -- the same defect the rehearsal block above was
        # corrected for, in a second place and a worse form, because there is no
        # `-f rehearse=true` on THIS command: at v0.3.0 the workflow declares no `rehearse`
        # input, carries none of the three composite actions (`git ls-tree -r --name-only
        # v0.3.0 -- .github/actions` returns nothing), has no `refs/tags/` gate at all, and
        # publishes to both registries unconditionally. A re-run dispatched at it would reach
        # BOTH PUBLISH STEPS past every gate this comment is describing. The tag to re-run at
        # is the tag of the release being re-run, and the error annotation below already
        # prints it in exactly this placeholder form.
        #
        # (Neither publish step is named here in the spelling its own `uses:` line carries.
        # `tests/test_ci_workflows.py:375` locates that step with
        # `step_containing(RELEASE, <the action ref>)` and takes the FIRST match, with no
        # comment stripping -- so an earlier step whose PROSE quotes the ref becomes the step
        # it reads, and its `skip-existing: true` assertion goes red against a gate that was
        # never the subject. Measured: naming it here failed exactly that test, 1 failed /
        # 5319 passed, while the publish step it judges was untouched.)
        #
        # No `${{ }}` in this script, deliberately: a runner-side expression is interpolated
        # before the shell sees it, so a gate written with one cannot be exercised by
        # anything but a real release. tests/test_ci_workflows.py extracts this script and
        # RUNS it — branch ref, PR ref, empty ref, matching tag, mismatched tag.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "::error::release.yml requires a tag ref; GITHUB_REF=${GITHUB_REF:-<empty>}."
              echo "::error::Re-run by dispatching at the tag: gh workflow run release.yml --ref vX.Y.Z"
              exit 1
              ;;
          esac
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NPM=$(node -p "require('./npm/package.json').version")
          echo "tag=$TAG pyproject=$PKG npm=$NPM"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != pyproject $PKG"; exit 1; }
          [ "$PKG" = "$NPM" ] || { echo "::error::pyproject $PKG != npm $NPM"; exit 1; }
      - name: The two workflows must read the same visibility
        # ONE DERIVED FACT, READ IN BOTH FILES. pages.yml treats the repository's visibility
        # as a live state -- its deploy job is fenced
        # `if: github.event.repository.private == false` and its comment records the
        # measurement that put it there (Pages went dark with the repo on 2026-08-11;
        # deploy-pages 404s against a Pages that does not exist, run 31726592984). release.yml
        # published with `npm publish --provenance --access public` unconditionally, with no
        # equivalent clause and no comment recording a decision either way -- so the two files
        # held different beliefs about one fact, and the disagreement sat on the step with no
        # compensator.
        #
        # THE PREMISE, FETCHED -- AND STILL UNVERIFIED ON THE POINT THAT MATTERS. Recorded
        # the way docs/license-map.md records a row: what was checked, where, on what date,
        # the operative sentence, and the verdict.
        #
        #   document : "Generating provenance statements", npm Docs
        #   url      : https://docs.npmjs.com/generating-provenance-statements
        #   fetched  : 2026-09-04 (wave 16; the one network fetch this wave allowed)
        #   operative sentence, quoted: "Ensure your `package.json` is configured with a
        #              public `repository` that matches (case-sensitive) where you are
        #              publishing with provenance from."
        #   verdict  : UNVERIFIED. That page states a requirement about the `repository`
        #              FIELD in the manifest -- which this package has, pointing at
        #              github.com/mcp-tool-shop-org/armature -- and says nothing about the
        #              repository's VISIBILITY. It names no error, no failure mode and no
        #              degradation for `npm publish --provenance` from a private repository.
        #              So the claim the seat before this one marked ASSUMED ("provenance is
        #              generated only from a public source repo, so `--provenance` fails at
        #              the publish rather than degrading") is neither confirmed nor refuted
        #              by the document that was named as the way to settle it.
        #
        # WHAT THIS REPOSITORY'S OWN RECORD SAYS, measured with no network: tag v0.3.0
        # (c7549b9, 2026-08-18) carries `npm publish --provenance --access public`
        # unconditionally in that tag's own `npm` job (a `<file>:<line>` pair pointed at a
        # TAGGED file resolves against the working tree, where the number means nothing and
        # moves under any edit -- as this one did when the gates were hoisted in wave 28),
        # and its npm/package.json:39-42 carries
        # `publishConfig: { access: public, provenance: true }`. That tag is seven days after
        # the ruling that took this repository private (pages.yml records the date,
        # 2026-08-11). So the experiment has been RUN once, from a private source repository,
        # with the flag on. NOT CHECKED HERE, and named rather than guessed: that run's log,
        # and whether `@mcptoolshop/armature-studio@0.3.0` exists on the registry. Either
        # would settle it; neither was retrieved, and no verdict is recorded as if it had
        # been.
        #
        # The BEHAVIOUR below is unchanged and stays chosen so that it is correct either way
        # -- public still attests, private still publishes, and neither reading makes the flag
        # the thing that decides whether a release completes. Re-fetch, or read the v0.3.0
        # run, before writing a narrower branch than that.
        #
        # This step reads the value and REFUSES anything that is not `true` or `false`. It runs
        # in `verify`, upstream of both publish jobs, because `pypi` and `npm` are siblings on
        # `needs: verify` and run in parallel: a refusal down in the npm job would leave PyPI
        # having taken the version, the tag cut, the release object public, and one registry
        # ahead of the other with a number that npm can only match by a fix-forward release.
        #
        # No `${{ }}` inside the script, the same discipline as the tag gate above: the
        # expression rides `env:` so tests/test_ci_workflows.py can extract this script and
        # drive it on every value.
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          case "$REPOSITORY_IS_PRIVATE" in
            true)
              echo "::notice::repository is PRIVATE; the npm job publishes without provenance."
              ;;
            false)
              echo "::notice::repository is PUBLIC; the npm job publishes with provenance."
              ;;
            *)
              echo "::error::github.event.repository.private read as '${REPOSITORY_IS_PRIVATE:-<empty>}', which is neither true nor false."
              echo "::error::Both publish jobs branch on this fact; refusing before either registry is reached."
              exit 1
              ;;
          esac
      - name: A pre-release must not reach either registry
        # THE ONE FACT ABOUT THE RELEASE OBJECT NOTHING HERE READ. `on.release.types:
        # [published]` is the whole trigger and, measured on `63191ee`, a grep for
        # `prerelease`, `dist-tag` or `--tag ` across `.github/`, `npm/package.json`,
        # `verify.ps1` and `pyproject.toml` returned NOTHING: no job, step or manifest read
        # `github.event.release.prerelease`, and the step that reaches the registry below
        # carries no `--tag` of its own, so npm defaults the dist-tag to
        # `latest`. A GitHub pre-release released through this workflow would therefore move
        # `@mcptoolshop/armature-studio`'s `latest` onto it, and `npm i
        # @mcptoolshop/armature-studio` would serve a pre-release to every user until somebody
        # ran `npm dist-tag add`. PyPI's half is benign — PEP 440 pre-releases are not
        # installed by default — so npm is the half with a user-visible effect.
        #
        # THE DECISION IS TO FAIL CLOSED, and the studio publishes no pre-release channel: a
        # release marked pre-release REFUSES here, upstream of the fork, rather than
        # publishing under `--tag next`. That also makes the one premise this gate rests on
        # moot. It was NOT fetched: whether the `published` activity type fires for a
        # pre-release is asserted from documented activity-type semantics and was not
        # retrieved with the network. If it does fire, this gate stops it; if it does not,
        # this gate never sees one. Either way nothing depends on the unfetched half.
        #
        # WHY THE EVENT NAME IS READ FIRST, deliberately and against the visibility gate's
        # shape. `github.event.release` exists only on a release event, so on the documented
        # rehearsal (`gh workflow run release.yml --ref vX.Y.Z -f rehearse=true`) this
        # expression is EMPTY. Refusing an unreadable value unconditionally — the visibility
        # gate's rule, correct there because `github.event.repository` is present on every
        # event — would halt the rehearsal at this very step and delete the only way to
        # exercise this file before a tag is public. So: on `release` the value must be
        # `true` or `false` and `true` refuses; on any other arrival there is no release
        # object and the run says so.
        #
        # No `${{ }}` inside the script, the same discipline as the two gates above: the
        # expression rides `env:` so tests/test_ci_workflows.py can extract this script and
        # drive it on every value of both variables.
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            release)
              case "$RELEASE_IS_PRERELEASE" in
                false)
                  echo "::notice::the release is not a pre-release; both publish jobs may run."
                  ;;
                true)
                  echo "::error::this release is marked PRE-RELEASE, and the step that reaches the registry carries no --tag, so npm would move the latest dist-tag onto it for every user of @mcptoolshop/armature-studio."
                  echo "::error::This studio publishes no pre-release channel. Refusing before either registry is reached; unmark the release, or cut a normal version."
                  exit 1
                  ;;
                *)
                  echo "::error::github.event.release.prerelease read as '${RELEASE_IS_PRERELEASE:-<empty>}', which is neither true nor false."
                  echo "::error::This gate decides whether the publish fork may run; refusing rather than guessing."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::notice::$GITHUB_EVENT_NAME carries no release object, so there is no pre-release flag to read; the tag gate above is what constrains this arrival."
              ;;
          esac
      - name: Install
        # The suite's dependency list is ci.yml's, verbatim including the pins — the
        # release gate runs the SAME suite CI runs, so a shorter list here would mean the
        # gate is a weaker check than the one that already passed on the same commit.
        # It was shorter once, and the first release attempt died on a missing Pillow at
        # collection rather than on anything about the release.
        #
        # `twine` is NOT here: it is installed, under a version constraint, by the
        # clean-room action that uses it — one place, one constraint.
        #
        # `build` IS here, because the SUITE needs it and the suite runs first. Two tests in
        # `tests/test_packaging.py` build an sdist by subprocess to pin what the published
        # archive carries, and with the tool absent they skipped — here, in the gate whose
        # whole job is to be the last thing between a tag and PyPI. The specifier is the
        # clean-room action's, character for character; `tests/test_ci_workflows.py` holds
        # every copy of it to one string, so the constraint still cannot fork.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pillow opencv-python-headless==5.0.0.93 matplotlib==3.11.1 "build>=1.5,<2" "requests>=2.32,<3"
      # The same font ci.yml installs, from the same implementation. This job ran the suite
      # without one: two tests hard-require a permitted face and FAIL rather than skip without
      # it, so this gate depended on exactly what ci.yml refuses to depend on — and by the time
      # it runs, `release: published` has fired and both registries are waiting.
      - uses: ./.github/actions/sheet-fonts
      - name: Suite
        run: python -m pytest -q
      # THE ENV VAR IS THE HALF THAT REACHES A CHILD, and this leg had only the flag.
      # ci.yml's twin sets `PYTHONOPTIMIZE: "1"` beside its `-O` (its
      # `run tests under -O (gates must still raise)` step) and verify.ps1's leg 2 exports it
      # around the call (its `tests under -O` leg); this step set
      # neither, so three copies of one leg read identically in a log and were not the same
      # check -- on the exact axis the leg exists for.
      #
      # Measured on the rig with the repo venv: a parent run as `python -O` spawning
      # `subprocess.run([sys.executable, "-c", ...])` gives a child with `__debug__` True and
      # `PYTHONOPTIMIZE` unset; the same parent with `PYTHONOPTIMIZE=1` in the environment
      # gives a child with `__debug__` False. `-O` governs the pytest process alone. An AST
      # walk over tests/** counts 57 subprocess calls, 17 of which inherit the environment and
      # pass no `-O` of their own -- those ran optimised under ci.yml's step and unoptimised
      # under this one.
      #
      # This is the workflow whose Install comment above says a shorter list here would make
      # the gate a weaker check than the one that already passed on the same commit. It was a
      # weaker check. By the time it runs, `release: published` has fired.
      - name: Suite under -O
        run: python -O -m pytest -q
        env:
          PYTHONOPTIMIZE: "1"
      # ci.yml's packaging leg, from the same implementation. This job built both artifacts
      # and ran `twine check` on the METADATA, and nothing in this workflow installed either
      # one — so the artifact handed to the publish step, the one step here with no
      # compensator, was the one artifact never installed anywhere in the workflow that
      # publishes it. The action builds, checks, installs the wheel into a clean venv and
      # calls through to every function-local dependency; `dist/` is left for the upload
      # step below.
      - uses: ./.github/actions/clean-room
      # The npm package's half of the same leg, and for the same reason: the `npm` job below
      # runs `npm publish --provenance --access public`, and the only thing that had ever
      # been run was `node bin/armature.mjs --node-selftest` out of the checkout. A `bin`
      # map that resolves to nothing installs cleanly and provides no command, and a version
      # on the registry is taken forever.
      - uses: ./.github/actions/npm-clean-room
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: verify
    # THE REHEARSAL SKIPS THE IRREVERSIBLE HALF, and both publish jobs carry the same clause
    # rather than one of them: a rehearsal that published to one registry would leave exactly
    # the asymmetric state the visibility gate in `verify` was hoisted upstream to prevent.
    #
    # `inputs` is empty on `release: published`, so `inputs.rehearse` is null there and this
    # reads true -- a real release publishes. On a dispatch it is the boolean the operator
    # picked. The direction of the failure mode is deliberate: if this expression is ever
    # wrong it is wrong toward NOT publishing, which a second dispatch fixes, rather than
    # toward publishing, which nothing fixes.
    if: ${{ !inputs.rehearse }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # A release workflow gets re-run — because a sibling job failed, because a gate caught
      # something, because a step was fixed. PyPI rejects a duplicate filename with a 400, so
      # without this the second run failed red for the sound reason that it had already
      # succeeded, while the npm job beside it reported an honest notice for the same state.
      # Two publish jobs, one re-run, two different verdicts is a red that carries no
      # information. `skip-existing` makes them say the same thing.
      #
      # Pinned to a commit SHA, not the `@release/v1` BRANCH ref it carried until 2026-09-04: a
      # branch resolves at run time, so the code performing the publish would not be the code
      # last reviewed. The SHA was resolved with `gh api` against the action's latest release
      # (tag v1.14.2, an annotated tag dereferenced to its commit), the same day and with the
      # network — never typed from memory, because a plausible-looking hash with a version
      # beside it would be a placeholder shaped like evidence. Bump deliberately, by re-resolving.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  npm:
    needs: verify
    # The same clause as `pypi` above, for the reason stated there: a rehearsal reaches
    # neither registry, and the two jobs must agree about that or the rehearsal creates the
    # divergence it exists to rule out.
    if: ${{ !inputs.rehearse }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # A job-level `permissions:` block REPLACES the workflow-level grant; every scope it
      # does not list is set to none. This job's step 1 is `actions/checkout`, which
      # authenticates the clone with GITHUB_TOKEN — with `id-token: write` alone that token
      # has no `contents` scope at all, and on a private repository the clone is the first
      # thing to fail. The pypi job's identical block is correct only because that job never
      # checks out. Declaring what the job does, rather than what it happened to survive.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC
        # Trusted publishing on npm needs npm >= 11.5.1; Node 22 ships npm 10, which would
        # look for a token that deliberately does not exist here and fail as an auth error
        # rather than as the version problem it actually is.
        #
        # `npm@^11.5.1`, not `npm@latest`: this installs the tool that performs the one step
        # with no compensator, and `@latest` means the code that runs on release day is not
        # the code that was last verified — a breaking major lands in the publish job with no
        # local reproduction of the version that ran. The constraint states the actual
        # requirement the comment above already names. Raising the major is a deliberate
        # edit, reviewed like any other.
        run: npm install -g npm@^11.5.1
      # NO GATE LIVES DOWNSTREAM OF THE FORK. There was one here -- `Launcher self-test`,
      # `npm test`, i.e. `node bin/armature.mjs --node-selftest` (npm/package.json:37) run out
      # of the checkout -- and it was the only step in this job that was a pure gate rather
      # than a structural requirement (the clone, the registry-configured node, and the npm
      # that performs OIDC publishing are the other three). It was also a strict SUBSET of a
      # check `verify` had already run: `.github/actions/npm-clean-room`, called at the
      # `uses:` line in `verify`, packs the package, installs the TARBALL into a scratch
      # prefix, refuses if no `armature` shim exists and runs `"$SHIM" --node-selftest` --
      # the same assertion on a strictly stronger artifact. That action's own header records
      # why the checkout-level form is the weaker one: it "consults neither `bin`, nor
      # `files`, nor the tarball", and was measured green with the `bin` map pointed at a
      # typo.
      #
      # So the only removable failure mode downstream of the fork could catch nothing
      # `verify` had not, while the state it COULD produce is the asymmetric one this file
      # names in the visibility gate: a refusal down here leaves PyPI having taken the
      # version, the tag cut, the release object public, and one registry ahead of the other
      # with a number npm can only match by a fix-forward release. `pypi` and `npm` are
      # siblings on `needs: verify` and run in parallel; every gate belongs upstream of that
      # fork, and every gate now is.
      #
      # `npm test` itself is not retired: ci.yml's `launcher` job still runs it across the
      # node 18/22 matrix, which is a stronger exercise of the launcher than one copy on
      # node 22 here, and verify.ps1's leg 3 runs it on the rig.
      #
      # A release workflow gets re-run — because a sibling job failed, because a gate
      # caught something, because a step was fixed. Publishing is the one step that
      # cannot be repeated: npm refuses a version that already exists, so on the second
      # run the whole job would fail red for the sound reason that it already succeeded.
      # This asks the registry first and reports the honest outcome either way.
      - name: Publish
        # THE FLAG IS GATED ON THE FACT pages.yml ALREADY READS. It was unconditional here,
        # and `npm/package.json` declared `publishConfig.provenance: true` beside it -- two
        # places asserting one thing, neither of which could be false while the repository is
        # private (see the visibility gate in `verify`, which states the premise and refuses an
        # unreadable value before either registry is reached). The `publishConfig` entry is
        # gone: the decision has one site, and it is this one, so a run cannot attest by a
        # route the branch below did not choose. `access: public` stays in the manifest --
        # that fact does not vary.
        #
        # Both branches still publish, and the notice says which form ran. Whichever way the
        # provenance premise resolves, a private release no longer fails at the one step with
        # no compensator while its PyPI sibling succeeds.
        working-directory: npm
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          # THE PROBE KEEPS BOTH ANSWERS. It was
          # `if npm view "$NAME@$VER" version >/dev/null 2>&1; then` — both streams to
          # /dev/null, branching on the exit code alone — and `npm view` exits 1 for
          # `this version is not on the registry` (E404) AND for `this job could not ask`.
          # Measured on `e8263a3` with no external egress:
          # `npm view @mcptoolshop/armature-studio@0.3.0 version --registry=http://127.0.0.1:1/`
          # exits 1 with `npm error code ECONNREFUSED`, the same code an E404 produces, and
          # driving this step's own `if` shape over a transport failure and over an E404 took
          # the SAME branch — fall through to `npm publish` — with the reason discarded in
          # both. So a re-run of a release whose npm publish had already succeeded would meet
          # a registry blip here, publish, and be refused a version that already exists: the
          # job turns red for having already succeeded, which is the outcome the comment
          # above says this step exists to prevent, with nothing in the log naming the
          # probe's failure.
          #
          # Only an E404 means "not published". Anything else is a refusal that halts with
          # the registry's own message. The verdict is echoed either way.
          VIEW_CODE=0
          VIEW=$(npm view "$NAME@$VER" version 2>&1) || VIEW_CODE=$?
          if [ "$VIEW_CODE" = "0" ]; then
            echo "::notice::$NAME@$VER is already on the registry (npm view answered '$VIEW') — nothing to publish."
          elif case "$VIEW" in *E404*) false ;; *) true ;; esac; then
            echo "::error::npm view $NAME@$VER exited $VIEW_CODE and the answer was not an E404, so this job cannot tell 'not published' from 'could not ask'."
            echo "::error::$VIEW"
            echo "::error::Refusing rather than publishing on an unanswered probe; publishing is the one step here with no compensator."
            exit 1
          else
            echo "::notice::$NAME@$VER: the registry answered E404 — not on the registry, so this run publishes."
            if [ "$REPOSITORY_IS_PRIVATE" = "false" ]; then
              echo "::notice::$NAME@$VER: repository is public — publishing WITH provenance."
              npm publish --provenance --access public
            elif [ "$REPOSITORY_IS_PRIVATE" = "true" ]; then
              echo "::notice::$NAME@$VER: repository is private — publishing WITHOUT provenance."
              npm publish --access public
            else
              echo "::error::github.event.repository.private read as '${REPOSITORY_IS_PRIVATE:-<empty>}'; refusing to publish on a visibility this job could not read."
              exit 1
            fi
          fi
