# THE TOOL THAT MAKES THE ARTIFACT, HELD TO A VERSION LIKE THE ONES THAT MOVE IT.
# `.github/actions/clean-room/action.yml` pins `build>=1.5,<2` and `twine>=7,<8` under a
# header calling them "the two tools that PRODUCE the artifact published irreversibly", and
# release.yml pins `npm@^11.5.1` saying `@latest` means the code running on release day is
# not the code that was verified. setuptools is the third tool in that sentence — it is what
# applies MANIFEST.in and SELECTS SDIST CONTENTS — and `setuptools>=68` bounded nothing
# above, so `python -m build` resolved it fresh from the index into its own isolated
# environment on release day. Measured 2026-09-04 on this tree: two invocations of one
# `python -m build` resolved into two different `build-env-*` directories, and the wheel
# carries `Generator: setuptools (84.0.0)`. Ceiling `<85` keeps the next major out of the
# publish path until someone runs it deliberately; `tests/test_ci_workflows.py` reads this
# line into the toolchain census, which until wave 10 could see every tool that INVOKES the
# build and not the one that performs it.
#
# `wheel` is gone rather than bounded: setuptools has carried its own `bdist_wheel` since
# 70.1, which the floor now guarantees, so the entry resolved a package the backend never
# used — dead weight that was still fetched fresh on release day. Re-measured after the
# change: `python -m build` produces the same wheel and sdist, and `twine check` passes.
#
# The floor was 70.1 for that reason (below it the `wheel` entry was load-bearing) and is
# now 77, where PEP 639's `license` expression and `license-files` below became readable.
[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "armature-studio"
version = "0.3.0"
description = "Block the shot; the model shoots it — GLB-authored previz, control sequences and gates for video-diffusion generation."
readme = "README.pypi.md"
# `>=3.11`, narrowed from `>=3.10` and now EXERCISED: ci.yml runs a 2-entry matrix at this
# floor and at the top classifier below. The floor moved up rather than being covered
# because two files in this repo's suite import `tomllib`, which landed in 3.11 — the suite
# that would prove 3.10 cannot collect on it, and a promise nothing can run is a promise
# this repo does not make. tests/test_ci_workflows.py reads the interval out of these two
# fields, so changing either moves the matrix with it.
requires-python = ">=3.11"
# PEP 639, and not the `{ file = "LICENSE" }` table this carried until 2026-09-04. Measured
# from one `python -m build` on this tree: the table raised
# `SetuptoolsDeprecationWarning: 'project.license' as a TOML table is deprecated ... By
# 2027-Feb-18, you need to update your project and remove deprecated calls`, on the wheel and
# on the sdist both. The removal would land on whichever release day CI resolved a setuptools
# that had dropped it — inside release.yml's `verify` job, after `release: published` has
# fired, on a tag already cut and public. `verify.ps1` says why the packaging leg exists at
# all: finding that out from a release job is finding it out too late to take back.
#
# `license` is now the SPDX expression and `license-files` names the text. The
# `License :: OSI Approved :: MIT License` classifier is GONE for the same reason — it raised
# the second deprecation, from `_apply_pyprojecttoml.py:61` and `dist.py:765` — and the
# expression above replaces it. `tests/test_ci_workflows.py`'s trigger derivation reads BOTH
# forms, so the LICENSE trigger requirement moved with the key instead of silently dropping
# out. Re-measured after the change: zero SetuptoolsDeprecationWarnings in the build.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = [
    "previz", "blender", "video-diffusion", "controlnet", "turnaround",
    "glb", "character", "animation", "comfyui", "sprite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # No `License ::` row: licence classifiers are deprecated with the same 2027-Feb-18
    # removal date, and `license = "MIT"` above is what replaces them.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    # "Topic :: Scientific :: Image Processing" does not exist. PyPI rejected the first
    # upload with a 400 on it, and `twine check` had passed — twine validates metadata
    # structure, not classifier membership. The real one carries "/Engineering".
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Every third-party module `armature_core` imports, declared. Three of them are imported
# inside function bodies — `cv2` and `matplotlib.colors` in `aapose`, `PIL.Image` in
# `donor_gate` — which is why `import armature_core.aapose` succeeded on an install that
# could not run it: the wheel was built, installed into a fresh venv with numpy alone, and
# `aapose.draw_body(...)` raised `ModuleNotFoundError: No module named 'cv2'` while
# `armature check` on that same install printed `all modules resolved` and exited 0. A
# function-local import is still a dependency; only the moment of failure moved.
#
# Declared rather than made an extra: the AAPose drawing path is how this repo produces a
# control sequence and `donor_gate` is Gate DONOR, so neither is optional to what the
# package is for, and an extra a user has to know about reproduces the same "no error
# naming the fix" failure one step later.
#
# The floors are the versions this rig and CI have actually run, not the oldest that would
# resolve: cv2 is the rasterizer the aapose golden frames were measured against, and a
# raster that disagrees with the goldens is a recipe that does not reproduce its output.
# The exact byte-stable pins stay in ci.yml, where the golden-frame suite runs.
# `opencv-python-headless` and not `opencv-python`: nothing here opens a window, and the
# GUI build pulls a desktop stack onto servers and runners that have none.
# `tests/test_packaging.py` fails if a new third-party import is added without a row here.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=5.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

# THE LIST THE SUITE ACTUALLY RUNS AGAINST, not a third copy that agrees with nothing.
# `dev = ["pytest>=8.0"]` was the manifest's only published statement of how to set up to run
# this suite, nothing installed it and nothing checked it: measured 2026-09-04, no `pip
# install` of `.[dev]` exists anywhere under `.github/**` or in `verify.ps1`, and a wheel
# built from this tree carried `Requires-Dist: pytest>=8.0; extra == "dev"` and nothing else
# for the extra. So an installer of `armature-studio[dev]` got pytest plus the four runtime
# deps at their FLOORS: an opencv that is not the version the aapose golden frames were
# measured against, reading as a code regression rather than a toolchain one — and no
# `build`, which is what makes the two tests that pin the published sdist's contents SKIP,
# the silent-skip this repo already paid to close in CI.
#
# The specifiers below are the ones ci.yml:239 and release.yml:69 install, character for
# character. `numpy` and `pillow` are not repeated here: CI installs them bare and they are
# runtime dependencies above, which is where the requirement already lives. `twine` is not
# here either — it moves the artifact and never runs the suite, and the toolchain census
# holds its constraint where it is installed.
# `tests/test_ci_workflows.py::test_the_manifest_states_the_dependency_list_the_suite_runs_against`
# derives CI's list from the jobs that run pytest and holds this block to it, so the two
# cannot fork the way the font dependency did.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "opencv-python-headless==5.0.0.93",
    "matplotlib==3.11.1",
    "build>=1.5,<2",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/armature/"
Repository = "https://github.com/mcp-tool-shop-org/armature"
Changelog = "https://github.com/mcp-tool-shop-org/armature/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/armature/issues"

[project.scripts]
armature = "armature_core.cli:main"

# WHAT THE SDIST CARRIES, MEASURED AND NOT YET DECIDED (2026-09-04). Built from this tree
# with the repo venv: armature_studio-0.3.0.tar.gz is 609,406 bytes and 156 files — 112
# `tests/test_*.py`, 32 armature_core modules, 6 of this build's own egg-info files, and the
# six root documents. It carries NONE of `tests/conftest.py`, `tests/blender_stub.py`,
# `tests/fake_backend.py`, `tests/fixtures/**`, `tests/blender/**`, or the 84 top-level
# `tools/*.py` those tests import. Unpacked and run against its own `testpaths`: 509 tests
# collected, 84 errors, `Interrupted: 84 errors during collection`. The same command in the
# repo collects 2380. The wheel is complete and correct; the defect is confined to what the
# SDIST claims to carry, and a downstream packager building from PyPI gets a suite that
# reads as self-verifying and cannot collect.
#
# The 112 files are not selected by anything here: they arrive through distutils' sdist
# `_add_defaults_optional` glob `tests/test*.py`, and the mechanism setuptools offers for
# overriding it is MANIFEST.in — measured on a `git archive` copy of this tree, where
# `prune tests` took the sdist to 45 files / 208,811 bytes with zero test files, and adding
# `recursive-exclude tools/armature_studio.egg-info *` took it to 40 files / 205,772 bytes.
# No `[tool.setuptools]` key selects sdist contents, so the fix is a file this domain does
# not own; it is recorded here rather than left as a surprise. Whoever lands MANIFEST.in
# should land the test that unpacks the built sdist and asserts the choice — ships no tests,
# or ships a suite that collects.
[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]
include = ["armature_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
