# THE TOOL THAT MAKES THE ARTIFACT, HELD TO A VERSION LIKE THE ONES THAT MOVE IT.
# `.github/actions/clean-room/action.yml` pins `build>=1.5,<2` and `twine>=7,<8` under a
# header calling them "the two tools that PRODUCE the artifact published irreversibly", and
# release.yml pins `npm@^11.5.1` saying `@latest` means the code running on release day is
# not the code that was verified. setuptools is the third tool in that sentence — it is what
# applies MANIFEST.in and SELECTS SDIST CONTENTS — and `setuptools>=68` bounded nothing
# above, so `python -m build` resolved it fresh from the index into its own isolated
# environment on release day. Measured 2026-09-04 on this tree: two invocations of one
# `python -m build` resolved into two different `build-env-*` directories, and the wheel
# carries `Generator: setuptools (84.0.0)`. Ceiling `<85` keeps the next major out of the
# publish path until someone runs it deliberately; `tests/test_ci_workflows.py` reads this
# line into the toolchain census, which until wave 10 could see every tool that INVOKES the
# build and not the one that performs it.
#
# `wheel` is gone rather than bounded: setuptools has carried its own `bdist_wheel` since
# 70.1, which the floor now guarantees, so the entry resolved a package the backend never
# used — dead weight that was still fetched fresh on release day. Re-measured after the
# change: `python -m build` produces the same wheel and sdist, and `twine check` passes.
#
# The floor was 70.1 for that reason (below it the `wheel` entry was load-bearing) and is
# now 77, where PEP 639's `license` expression and `license-files` below became readable.
[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "armature-studio"
version = "0.4.0"
description = "Block the shot; the model shoots it — GLB-authored previz, control sequences and gates for video-diffusion generation."
readme = "README.pypi.md"
# `>=3.11`, narrowed from `>=3.10` and now EXERCISED: ci.yml runs a 2-entry matrix at this
# floor and at the top classifier below. The floor moved up rather than being covered
# because two files in this repo's suite import `tomllib`, which landed in 3.11 — the suite
# that would prove 3.10 cannot collect on it, and a promise nothing can run is a promise
# this repo does not make. tests/test_ci_workflows.py reads the interval out of these two
# fields, so changing either moves the matrix with it.
#
# AND `<3.15`, WHICH IS THE HALF pip ENFORCES. This field stated a floor and no ceiling, so
# pip installed this distribution on every future CPython — while
# `tests/test_ci_workflows.py::test_the_declared_python_interval_is_the_one_ci_runs` derived
# its CEILING from the `Programming Language :: Python :: 3.13` classifier below, which is
# metadata pip reads for DISPLAY and never for resolution. So the census could assert that
# the floor and the ceiling were both exercised while the interval the artifact actually
# promised was open at the top and exercised nowhere. The ceiling now lives here, where pip
# reads it, and the census reads it from here; the classifier list is held INSIDE the
# interval rather than defining it.
#
# `<3.15` and not `<3.14`, measured: this rig's venv — the interpreter every leg of
# `verify.ps1` runs, including both clean-room installs of the built wheel — reports Python
# 3.14.5. So 3.14 IS exercised, by the rig and not by CI, and a `<3.14` bound would refuse
# the pre-tag gate's own installs. The matrix in ci.yml stays `["3.11", "3.13"]` under the
# studio's CI-minutes rule; what is claimed and what each version is exercised BY is now
# written down rather than inferred:
#   3.11  ci.yml python-tests (the declared floor)
#   3.12  claimed by a classifier, inside the interval, run by no job — an interpolation
#   3.13  ci.yml python-tests and release.yml verify (the top classifier)
#   3.14  the rig's venv, through verify.ps1's four legs; no runner runs it
# Raising this bound is the same deliberate edit `npm@^11.5.1` and `trove-classifiers<2027`
# already are.
requires-python = ">=3.11,<3.15"
# PEP 639, and not the `{ file = "LICENSE" }` table this carried until 2026-09-04. Measured
# from one `python -m build` on this tree: the table raised
# `SetuptoolsDeprecationWarning: 'project.license' as a TOML table is deprecated ... By
# 2027-Feb-18, you need to update your project and remove deprecated calls`, on the wheel and
# on the sdist both. The removal would land on whichever release day CI resolved a setuptools
# that had dropped it — inside release.yml's `verify` job, after `release: published` has
# fired, on a tag already cut and public. `verify.ps1` says why the packaging leg exists at
# all: finding that out from a release job is finding it out too late to take back.
#
# `license` is now the SPDX expression and `license-files` names the text. The
# `License :: OSI Approved :: MIT License` classifier is GONE for the same reason — it raised
# the second deprecation, from `_apply_pyprojecttoml.py:61` and `dist.py:765` — and the
# expression above replaces it. `tests/test_ci_workflows.py`'s trigger derivation reads BOTH
# forms, so the LICENSE trigger requirement moved with the key instead of silently dropping
# out. Re-measured after the change: zero SetuptoolsDeprecationWarnings in the build.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = [
    "previz", "blender", "video-diffusion", "controlnet", "turnaround",
    "glb", "character", "animation", "comfyui", "sprite",
]
# THE PYPI 400 RECORD lives in this block, and `.github/actions/clean-room/action.yml` and
# `classifier_gate.py` both cite it. They cited it as a line range, and the PEP 639 licence
# edit moved it; both now name this block instead.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # No `License ::` row: licence classifiers are deprecated with the same 2027-Feb-18
    # removal date, and `license = "MIT"` above is what replaces them.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    # "Topic :: Scientific :: Image Processing" does not exist. PyPI rejected the first
    # upload with a 400 on it, and `twine check` had passed — twine validates metadata
    # structure, not classifier membership. The real one carries "/Engineering".
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Every third-party module `armature_core` imports, declared. Three of them are imported
# inside function bodies — `cv2` and `matplotlib.colors` in `aapose`, `PIL.Image` in
# `donor_gate` — which is why `import armature_core.aapose` succeeded on an install that
# could not run it: the wheel was built, installed into a fresh venv with numpy alone, and
# `aapose.draw_body(...)` raised `ModuleNotFoundError: No module named 'cv2'` while
# `armature check` on that same install printed `all modules resolved` and exited 0. A
# function-local import is still a dependency; only the moment of failure moved.
#
# Declared rather than made an extra: the AAPose drawing path is how this repo produces a
# control sequence and `donor_gate` is Gate DONOR, so neither is optional to what the
# package is for, and an extra a user has to know about reproduces the same "no error
# naming the fix" failure one step later.
#
# WHAT THE FLOORS ARE, corrected in place with the measurement that overturned the earlier
# sentence. They are the OLDEST VERSIONS THE MAINTAINERS ARE WILLING TO SUPPORT — not
# versions that were exercised. The line here used to read "the floors are the versions this
# rig and CI have actually run, not the oldest that would resolve", and re-measured with
# `importlib.metadata` on the repo venv (E:\AI\armature\.venv, Python 3.14.5) that is false
# for every row: numpy 2.5.2 against a `>=1.24` floor, pillow 12.3.0 against `>=10.0`,
# matplotlib 3.11.1 against `>=3.7`. CI pins matplotlib==3.11.1 and
# opencv-python-headless==5.0.0.93 (ci.yml, release.yml), so three of the four floors name
# versions neither the rig nor CI has ever run. A resolver may legitimately install numpy
# 1.24 / pillow 10.0 / matplotlib 3.7 here, and no job in this repository has.
#
# THE OPENCV DISTRIBUTION SPLIT, recorded rather than implied. Three distributions provide
# the `cv2` module and this repository touches two of them:
#   declared here / installed by CI : `opencv-python-headless` (==5.0.0.93 in ci.yml and
#                                     release.yml) — nothing here opens a window, and the GUI
#                                     build pulls a desktop stack onto runners that have none
#   installed on the rig            : `opencv-contrib-python` 5.0.0.93 — measured 2026-09-05,
#                                     `opencv-python-headless` and `opencv-python` are BOTH
#                                     ABSENT from the repo venv, and `cv2.__version__` reads
#                                     5.0.0
# Same upstream version, different distribution: the rasterizer the aapose golden frames were
# measured against is the one CI pins, and the rig satisfies the same import by another
# package. `pip install armature-studio` gets the headless build, which is the promise this
# row makes. The exact byte-stable pins stay in ci.yml, where the golden-frame suite runs.
# `tests/test_packaging.py` fails if a new third-party import is added without a row here.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=5.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

# THE LIST THE SUITE ACTUALLY RUNS AGAINST, not a third copy that agrees with nothing.
# `dev = ["pytest>=8.0"]` was the manifest's only published statement of how to set up to run
# this suite, nothing installed it and nothing checked it: measured 2026-09-04, no `pip
# install` of `.[dev]` exists anywhere under `.github/**` or in `verify.ps1`, and a wheel
# built from this tree carried `Requires-Dist: pytest>=8.0; extra == "dev"` and nothing else
# for the extra. So an installer of `armature-studio[dev]` got pytest plus the four runtime
# deps at their FLOORS: an opencv that is not the version the aapose golden frames were
# measured against, reading as a code regression rather than a toolchain one — and no
# `build`, which is what makes the two tests that pin the published sdist's contents SKIP,
# the silent-skip this repo already paid to close in CI.
#
# The specifiers below are the ones the `install test dependencies` step of ci.yml's
# `python-tests` job and the `Install` step of release.yml's `verify` job install, character
# for character — WITH THE THREE DELIBERATE DIFFERENCES NAMED, because a sentence that says
# `character for character` and overstates by one row is the reason to distrust the whole
# block. `numpy` and `pillow` are not repeated here: CI installs them bare and they are
# runtime dependencies above, which is where the requirement already lives. `twine` is not
# here either — it moves the artifact and never runs the suite, and the toolchain census
# holds its constraint where it is installed. And `pytest>=8.0` carries a FLOOR that neither
# CI list has: both install a bare `pytest`, so this row states a minimum the jobs do not
# state rather than repeating one they do.
#
# THE CITATIONS HERE NAME STEPS, NOT LINES, and that is a correction. This sentence read
# `the ones ci.yml:239 and release.yml:69 install`; re-resolved 2026-09-05 in a worktree,
# ci.yml:239 is a comment about the honest skip count and release.yml:69 is prose inside the
# rehearsal block — the two install lines had moved, one of them under wave 23's own
# pre-release gate. A step name does not move when sixty lines are inserted above it.
# `tests/test_ci_workflows.py::test_the_manifest_states_the_dependency_list_the_suite_runs_against`
# derives CI's list from the jobs that run pytest and holds this block to it, so the two
# cannot fork the way the font dependency did.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "opencv-python-headless==5.0.0.93",
    "matplotlib==3.11.1",
    "build>=1.5,<2",
    # `tests/test_packaging.py` derives the netrc carrier names from `requests.utils.NETRC_FILES`
    # (the credential census, wave 18) and imports `requests` at module level, so three test
    # modules fail at COLLECTION on an interpreter that lacks it. The rig's venv had it only as
    # twine's transitive dependency, which is why the suite was green here and red on the first
    # CI run of the swarm (2026-09-05, `c28feca`). Declared where the suite's other dependencies
    # are, at the same string ci.yml and release.yml install; the ceiling because the release job
    # must not pick up a new major on the day it runs.
    "requests>=2.32,<3",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/armature/"
Repository = "https://github.com/mcp-tool-shop-org/armature"
Changelog = "https://github.com/mcp-tool-shop-org/armature/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/armature/issues"

[project.scripts]
armature = "armature_core.cli:main"

# WHAT THE SDIST CARRIES — DECIDED, LANDED, AND PINNED. Re-measured 2026-09-05 on `63191ee`
# by building both artifacts from a `git archive` scratch copy with the repo venv:
# `armature_studio-0.3.0.tar.gz` is 357,553 bytes and 40 files — 32 `armature_core` modules
# plus LICENSE, MANIFEST.in, PKG-INFO, README.md, README.pypi.md, pyproject.toml, setup.cfg
# and `tools/armature_studio.egg-info/SOURCES.txt` — and ZERO test files. The archive ships
# no tests at all.
#
# THE BEFORE-STATE this answered, kept as the dated measurement it was (2026-09-04, before
# MANIFEST.in existed): the sdist was 609,406 bytes and 156 files — 112 `tests/test_*.py`
# arriving through distutils' sdist `_add_defaults_optional` glob `tests/test*.py`, and NONE
# of `tests/conftest.py`, `tests/blender_stub.py`, `tests/fake_backend.py`,
# `tests/fixtures/**`, `tests/blender/**` or the 84 top-level `tools/*.py` those tests import.
# Unpacked and run against its own `testpaths`: 509 collected, 84 collection errors. A suite
# that reads as self-verifying and cannot collect is a false record.
#
# THE DECISION, and where it lives. `MANIFEST.in` in this tree prunes `tests`, `specs`,
# `docs`, `site`, `npm` and `outputs`, excludes a stale checked-out egg-info directory and
# `*.pyc`; the sdist ships the package and the root documents, and the suite is run from the
# repository (`verify.ps1`, `ci.yml`) where its fixtures and the rig's assets exist.
# `tests/test_packaging.py` unpacks the BUILT sdist and asserts that choice, so the archive
# cannot quietly regain a partial suite.
#
# This block said the opposite until wave 23 — it described the 156-file archive in the
# present tense, called the outcome undecided, and said "the fix is a file this domain does
# not own; whoever lands MANIFEST.in should land the test". Both had been in the tree for
# waves. Corrected in place with the measurement, which is the more useful record.
[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]
include = ["armature_core*"]

# `armature_core.canon.DEFAULT_ROOT` resolves to `armature_core/canon/` inside the package.
# Without this row setuptools ships `.py` alone, so the first ratified surfaces JSON would
# resolve from a source checkout and be absent from every installed wheel.
[tool.setuptools.package-data]
armature_core = ["canon/*.json"]

[tool.pytest.ini_options]
# MANIFEST.in prunes `tests/`; the sdist ships NO tests. This `testpaths` entry is for the
# repository checkout (`verify.ps1`, `ci.yml`). Unpacking the sdist and running pytest
# there yields PytestConfigWarning (no files in testpaths) rather than a recursive search
# that pretends the archive is a suite — keep the path so a checkout stays explicit.
testpaths = ["tests"]