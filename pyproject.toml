[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armature-studio"
version = "0.3.0"
description = "Block the shot; the model shoots it — GLB-authored previz, control sequences and gates for video-diffusion generation."
readme = "README.pypi.md"
# `>=3.11`, narrowed from `>=3.10` and now EXERCISED: ci.yml runs a 2-entry matrix at this
# floor and at the top classifier below. The floor moved up rather than being covered
# because two files in this repo's suite import `tomllib`, which landed in 3.11 — the suite
# that would prove 3.10 cannot collect on it, and a promise nothing can run is a promise
# this repo does not make. tests/test_ci_workflows.py reads the interval out of these two
# fields, so changing either moves the matrix with it.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = [
    "previz", "blender", "video-diffusion", "controlnet", "turnaround",
    "glb", "character", "animation", "comfyui", "sprite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    # "Topic :: Scientific :: Image Processing" does not exist. PyPI rejected the first
    # upload with a 400 on it, and `twine check` had passed — twine validates metadata
    # structure, not classifier membership. The real one carries "/Engineering".
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Every third-party module `armature_core` imports, declared. Three of them are imported
# inside function bodies — `cv2` and `matplotlib.colors` in `aapose`, `PIL.Image` in
# `donor_gate` — which is why `import armature_core.aapose` succeeded on an install that
# could not run it: the wheel was built, installed into a fresh venv with numpy alone, and
# `aapose.draw_body(...)` raised `ModuleNotFoundError: No module named 'cv2'` while
# `armature check` on that same install printed `all modules resolved` and exited 0. A
# function-local import is still a dependency; only the moment of failure moved.
#
# Declared rather than made an extra: the AAPose drawing path is how this repo produces a
# control sequence and `donor_gate` is Gate DONOR, so neither is optional to what the
# package is for, and an extra a user has to know about reproduces the same "no error
# naming the fix" failure one step later.
#
# The floors are the versions this rig and CI have actually run, not the oldest that would
# resolve: cv2 is the rasterizer the aapose golden frames were measured against, and a
# raster that disagrees with the goldens is a recipe that does not reproduce its output.
# The exact byte-stable pins stay in ci.yml, where the golden-frame suite runs.
# `opencv-python-headless` and not `opencv-python`: nothing here opens a window, and the
# GUI build pulls a desktop stack onto servers and runners that have none.
# `tests/test_packaging.py` fails if a new third-party import is added without a row here.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=5.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/armature/"
Repository = "https://github.com/mcp-tool-shop-org/armature"
Changelog = "https://github.com/mcp-tool-shop-org/armature/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/armature/issues"

[project.scripts]
armature = "armature_core.cli:main"

[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]
include = ["armature_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
